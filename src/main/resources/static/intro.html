
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07152F">

    <title>ArtAdeola ResinHub</title>

    <style>
        :root {
            --royal-blue: #1746A2;
            --deep-blue: #07152F;
            --mid-blue: #10285F;
            --silver: #C0C5CE;
            --light-silver: #EEF1F6;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--white);
            background: var(--deep-blue);
        }

        /* MAIN SCREEN */

        .intro-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            isolation: isolate;

            background:
                radial-gradient(
                    ellipse at 15% 20%,
                    rgba(57, 112, 225, 0.42),
                    transparent 40%
                ),
                radial-gradient(
                    ellipse at 85% 80%,
                    rgba(192, 197, 206, 0.17),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #06112B,
                    #10285F,
                    #1746A2,
                    #081632
                );

            background-size: 180% 180%;
            animation: backgroundFlow 12s ease-in-out infinite alternate;
        }

        /* BACKGROUND LIGHT */

        .ambient-light {
            position: absolute;
            z-index: -1;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: rgba(192, 197, 206, 0.15);
            filter: blur(100px);
            animation: ambientPulse 5s ease-in-out infinite alternate;
        }

        /* DECORATIVE RINGS */

        .ring {
            position: absolute;
            z-index: -1;
            left: 50%;
            top: 50%;
            border: 1px solid rgba(192, 197, 206, 0.16);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .ring-one {
            width: min(78vw, 550px);
            aspect-ratio: 1;
            animation: ringRotate 24s linear infinite;
        }

        .ring-two {
            width: min(92vw, 680px);
            aspect-ratio: 1;
            border-style: dashed;
            border-color: rgba(238, 241, 246, 0.09);
            animation: ringRotate 40s linear infinite reverse;
        }

        .ring-three {
            width: min(105vw, 790px);
            aspect-ratio: 1;
            border-color: rgba(23, 70, 162, 0.35);
            animation: ringPulse 6s ease-in-out infinite;
        }

        /* LIQUID RESIN SHAPES */

        .resin {
            position: absolute;
            z-index: -1;
            width: 190px;
            height: 190px;
            border-radius: 62% 38% 40% 60% / 45% 45% 55% 55%;

            background: linear-gradient(
                135deg,
                #FFFFFF 0%,
                #C0C5CE 13%,
                #527FD3 30%,
                #1746A2 48%,
                #07152F 65%,
                #EEF1F6 82%,
                #1746A2 100%
            );

            background-size: 300% 300%;

            opacity: 0;
            filter: drop-shadow(0 0 25px rgba(192, 197, 206, 0.2));

            animation:
                resinAppear 2.5s ease forwards,
                resinMorph 8s ease-in-out 2.5s infinite,
                resinShine 6s ease-in-out infinite;
        }

        .resin-one {
            top: 10%;
            left: -65px;
            animation-delay: 0s, 2.5s, 0s;
        }

        .resin-two {
            width: 145px;
            height: 145px;
            right: -40px;
            top: 25%;
            animation-delay: 0.4s, 2.9s, 0.5s;
        }

        .resin-three {
            width: 125px;
            height: 125px;
            bottom: 5%;
            left: 12%;
            animation-delay: 0.7s, 3.2s, 1s;
        }

        .resin-four {
            width: 170px;
            height: 170px;
            bottom: 8%;
            right: 8%;
            animation-delay: 0.2s, 2.7s, 1.5s;
        }

        /* FLOATING SILVER PARTICLES */

        .particles {
            position: absolute;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--white);

            box-shadow:
                0 0 8px var(--silver),
                0 0 18px rgba(192, 197, 206, 0.65);

            opacity: 0;
            animation: particleFloat 5s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            left: 12%;
            top: 25%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 80%;
            top: 18%;
            animation-delay: 1s;
        }

        .particle:nth-child(3) {
            left: 22%;
            top: 70%;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            left: 75%;
            top: 68%;
            animation-delay: 0.5s;
        }

        .particle:nth-child(5) {
            left: 50%;
            top: 15%;
            animation-delay: 1.8s;
        }

        .particle:nth-child(6) {
            left: 88%;
            top: 48%;
            animation-delay: 2.5s;
        }

        .particle:nth-child(7) {
            left: 9%;
            top: 53%;
            animation-delay: 1.3s;
        }

        .particle:nth-child(8) {
            left: 57%;
            top: 83%;
            animation-delay: 3s;
        }

        .particle:nth-child(9) {
            left: 40%;
            top: 32%;
            animation-delay: 0.8s;
        }

        .particle:nth-child(10) {
            left: 68%;
            top: 42%;
            animation-delay: 2.2s;
        }

        /* BRAND CONTENT */

        .logo-wrapper {
            position: relative;
            z-index: 2;

            width: min(390px, 88vw);
            padding: 36px 25px 32px;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            border: 1px solid rgba(192, 197, 206, 0.4);
            border-radius: 28px;

            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.10),
                rgba(255, 255, 255, 0.025)
            );

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.20),
                0 0 40px rgba(192, 197, 206, 0.08),
                inset 0 0 35px rgba(255, 255, 255, 0.025);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            opacity: 0;
            transform: translateY(22px) scale(0.9);

            animation: logoReveal 1.4s ease-out 0.5s forwards;
        }

        /* ANIMATED SILVER FRAME */

        .logo-wrapper::before {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 31px;
            border: 1px solid rgba(238, 241, 246, 0.3);

            box-shadow:
                0 0 18px rgba(192, 197, 206, 0.12),
                0 0 40px rgba(23, 70, 162, 0.22);

            pointer-events: none;

            animation: silverGlow 3s ease-in-out infinite alternate;
        }

        /* MOVING LIGHT ACROSS FRAME */

        .frame-light {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: 28px;
            pointer-events: none;
        }

        .frame-light::after {
            content: "";
            position: absolute;
            top: -100%;
            left: -70%;
            width: 45%;
            height: 300%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.12),
                transparent
            );

            transform: rotate(25deg);
            animation: lightSweep 4s ease-in-out 2s infinite;
        }

        /* YOUR ORIGINAL LOGO */

        .logo-wrapper img {
            display: block;
            position: relative;
            z-index: 2;

            width: min(250px, 70vw);
            max-height: 270px;

            object-fit: contain;

            filter:
                drop-shadow(0 0 12px rgba(192, 197, 206, 0.25))
                drop-shadow(0 0 28px rgba(23, 70, 162, 0.35));
        }

        /* FALLBACK IF LOGO IS NOT FOUND */

        .logo-fallback {
            display: none;
            padding: 20px 0;
            text-align: center;
        }

        .logo-fallback .letter {
            font-family: Georgia, serif;
            font-size: 95px;
            font-style: italic;
            color: var(--light-silver);
            text-shadow: 0 0 25px rgba(192, 197, 206, 0.4);
        }

        .logo-fallback .brand-name {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* SILVER DIVIDER */

        .silver-line {
            width: 0;
            height: 2px;
            margin-top: 23px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--silver),
                var(--white),
                var(--silver),
                transparent
            );

            box-shadow: 0 0 12px rgba(192, 197, 206, 0.4);

            animation: lineReveal 1s ease 1.6s forwards;
        }

        /* TAGLINE */

        .tagline {
            margin-top: 20px;
            color: var(--light-silver);

            font-size: clamp(10px, 2.5vw, 12px);
            font-weight: 500;
            letter-spacing: 2.5px;
            line-height: 1.9;
            text-transform: uppercase;

            opacity: 0;
            animation: textReveal 1s ease 1.9s forwards;
        }

        /* LOADING MESSAGE */

        .loading {
            position: absolute;
            bottom: 42px;
            z-index: 3;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;

            color: rgba(238, 241, 246, 0.78);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 3px;
            text-align: center;

            opacity: 0;
            animation: textReveal 0.8s ease 2.2s forwards;
        }

        .loading-track {
            width: 125px;
            height: 2px;
            overflow: hidden;
            border-radius: 10px;
            background: rgba(192, 197, 206, 0.2);
        }

        .loading-bar {
            width: 35%;
            height: 100%;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                var(--royal-blue),
                var(--white),
                var(--silver)
            );

            animation: loadingMove 1.4s ease-in-out infinite alternate;
        }

        /* ANIMATIONS */

        @keyframes backgroundFlow {
            0% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 100%;
            }
        }

        @keyframes ambientPulse {
            from {
                transform: scale(0.8);
                opacity: 0.4;
            }

            to {
                transform: scale(1.2);
                opacity: 0.9;
            }
        }

        @keyframes ringRotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes ringPulse {
            0%, 100% {
                opacity: 0.35;
                scale: 0.96;
            }

            50% {
                opacity: 0.8;
                scale: 1.03;
            }
        }

        @keyframes resinAppear {
            0% {
                opacity: 0;
                scale: 0.1;
                rotate: -60deg;
            }

            60% {
                opacity: 0.8;
                scale: 1.08;
                rotate: 12deg;
            }

            100% {
                opacity: 0.5;
                scale: 1;
                rotate: 0deg;
            }
        }

        @keyframes resinMorph {
            0%, 100% {
                border-radius: 62% 38% 40% 60% / 45% 45% 55% 55%;
                translate: 0 0;
            }

            35% {
                border-radius: 38% 62% 55% 45% / 60% 40% 60% 40%;
                translate: 12px -15px;
            }

            70% {
                border-radius: 55% 45% 35% 65% / 40% 60% 40% 60%;
                translate: -8px 10px;
            }
        }

        @keyframes resinShine {
            0%, 100% {
                background-position: 0% 50%;
                filter: brightness(0.9);
            }

            50% {
                background-position: 100% 50%;
                filter: brightness(1.25);
            }
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(0.5);
            }

            50% {
                opacity: 0.85;
                transform: translateY(-15px) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translateY(-50px) scale(0.4);
            }
        }

        @keyframes logoReveal {
            0% {
                opacity: 0;
                transform: translateY(22px) scale(0.9);
            }

            70% {
                opacity: 1;
                transform: translateY(-3px) scale(1.02);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes silverGlow {
            from {
                opacity: 0.4;
                box-shadow: 0 0 10px rgba(192, 197, 206, 0.1);
            }

            to {
                opacity: 1;
                box-shadow:
                    0 0 22px rgba(192, 197, 206, 0.28),
                    0 0 45px rgba(23, 70, 162, 0.3);
            }
        }

        @keyframes lightSweep {
            0%, 20% {
                left: -70%;
            }

            65%, 100% {
                left: 140%;
            }
        }

        @keyframes lineReveal {
            from {
                width: 0;
            }

            to {
                width: min(250px, 72vw);
            }
        }

        @keyframes textReveal {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loadingMove {
            from {
                transform: translateX(-40px);
            }

            to {
                transform: translateX(40px);
            }
        }

        /* MOBILE DESIGN */

        @media (max-width: 480px) {
            .logo-wrapper {
                width: 88%;
                padding: 30px 18px 27px;
            }

            .logo-wrapper img {
                width: min(225px, 68vw);
                max-height: 230px;
            }

            .ring-one {
                width: 85vw;
            }

            .ring-two {
                width: 105vw;
            }

            .resin-one {
                width: 115px;
                height: 115px;
            }

            .resin-two {
                width: 90px;
                height: 90px;
            }

            .resin-three {
                width: 80px;
                height: 80px;
            }

            .resin-four {
                width: 110px;
                height: 110px;
            }

            .tagline {
                letter-spacing: 1.8px;
            }

            .loading {
                bottom: 25px;
                letter-spacing: 2px;
            }
        }

        /* REDUCED MOTION ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {
            .intro-container *,
            .intro-container *::before,
            .intro-container *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

<main class="intro-container">

    <div class="ambient-light"></div>

    <!-- Elegant moving rings -->

    <div class="ring ring-one"></div>
    <div class="ring ring-two"></div>
    <div class="ring ring-three"></div>

    <!-- Flowing resin shapes -->

    <div class="resin resin-one"></div>
    <div class="resin resin-two"></div>
    <div class="resin resin-three"></div>
    <div class="resin resin-four"></div>

    <!-- Floating silver particles -->

    <div class="particles">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <!-- Brand logo and tagline -->

    <section class="logo-wrapper">

        <div class="frame-light"></div>

        <img
                id="brandLogo"
                src="/images/artadeola-logo.png"
                alt="ArtAdeola ResinHub Logo"
        >

        <div class="logo-fallback" id="logoFallback">
            <div class="letter">A</div>
            <div class="brand-name">ArtAdeola ResinHub</div>
        </div>

        <div class="silver-line"></div>

        <p class="tagline">
            Your Trusted Hub for Resin Materials
        </p>

    </section>

    <!-- Animated loading indicator -->

    <div class="loading">
        <span>PREPARING YOUR EXPERIENCE</span>

        <div class="loading-track">
            <div class="loading-bar"></div>
        </div>
    </div>

</main>

<script>
        /*
         * ArtAdeola ResinHub Intro
         *
         * Keep the existing welcome page unchanged.
         * After the animation, continue to index.html.
         */

        const INTRO_DURATION = 6000;
        const WELCOME_PAGE = "/index.html";

        const brandLogo = document.getElementById("brandLogo");
        const logoFallback = document.getElementById("logoFallback");

        brandLogo.addEventListener("error", function () {
            brandLogo.style.display = "none";
            logoFallback.style.display = "block";
        });

        window.setTimeout(function () {
            window.location.replace(WELCOME_PAGE);
        }, INTRO_DURATION);
    </script>

</body>
</html>
