
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Cart | ArtAdeola ResinHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #10285f;
        }

        header {
            background: #1746a2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 25px;
        }

        header p {
            margin-top: 6px;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .cart-heading {
            margin-bottom: 20px;
        }

        .cart-heading h2 {
            font-size: 25px;
        }

        .cart-heading p {
            color: #667085;
            margin-top: 7px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            align-items: start;
        }

        .cart-items,
        .summary {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-details {
            flex: 1;
            min-width: 0;
        }

        .item-details h3 {
            font-size: 17px;
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .option-name {
            color: #1746a2;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .item-price {
            color: #667085;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-control button {
            width: 32px;
            height: 32px;
            border: 1px solid #c0c0c0;
            background: #edf3ff;
            color: #1746a2;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .quantity-control span {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .item-right {
            text-align: right;
            min-width: 100px;
        }

        .item-total {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .remove-btn {
            border: none;
            background: none;
            color: #c62828;
            cursor: pointer;
            font-size: 13px;
        }

        .summary h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
            color: #555;
            font-size: 14px;
        }

        .summary-total {
            border-top: 1px solid #ddd;
            padding-top: 17px;
            margin-top: 17px;
            font-size: 18px;
            font-weight: bold;
            color: #10285f;
        }

        .checkout-btn {
            width: 100%;
            background: #1746a2;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .checkout-btn:hover {
            background: #10285f;
        }

        .checkout-btn:disabled {
            background: #aab3c5;
            cursor: not-allowed;
        }

        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1746a2;
            text-decoration: none;
            font-size: 14px;
        }

        .empty-cart {
            text-align: center;
            padding: 45px 15px;
        }

        .empty-cart h3 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #667085;
            margin-bottom: 20px;
        }

        .shop-btn {
            display: inline-block;
            background: #1746a2;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 6px;
        }

        .notice {
            color: #b42318;
            font-size: 12px;
            margin-top: 8px;
        }

        @media (max-width: 700px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .item-right {
                min-width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: left;
            }

            .item-total {
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ArtAdeola ResinHub</h1>
    <p>Your Trusted Hub for Resin Materials</p>
</header>

<div class="container">

    <div class="cart-heading">
        <h2>My Shopping Cart</h2>
        <p>Review your selected products before checkout.</p>
    </div>

    <div id="cartContent"></div>

</div>

<script>
    // Customer-specific cart
    const customerId = sessionStorage.getItem("customerId");
    const cartKey = "artadeola_cart_" + customerId;

    let cart = [];

    function loadCart() {
        try {
            cart = JSON.parse(localStorage.getItem(cartKey)) || [];

            if (!Array.isArray(cart)) {
                cart = [];
            }
        } catch (error) {
            cart = [];
        }

        renderCart();
    }

    function saveCart() {
        localStorage.setItem(cartKey, JSON.stringify(cart));
        renderCart();
    }

    function getPrice(item) {
        const price = Number(item.price);
        return Number.isFinite(price) && price >= 0 ? price : 0;
    }

    function getQuantity(item) {
        const quantity = Number(item.quantity);
        return Number.isInteger(quantity) && quantity > 0 ? quantity : 1;
    }

    function getStock(item) {
        const stock = Number(item.stockQuantity);

        if (
            item.stockQuantity === null ||
            item.stockQuantity === undefined ||
            item.stockQuantity === ""
        ) {
            return null;
        }

        return Number.isFinite(stock) && stock >= 0 ? stock : null;
    }

    function formatPrice(amount) {
        return "₦" + Number(amount).toLocaleString("en-NG", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function getItemName(item) {
        return item.productName || item.name || "Product";
    }

    function getOptionName(item) {
        return item.optionName || "";
    }

    function getLineTotal(item) {
        return getPrice(item) * getQuantity(item);
    }

    function renderCart() {
        const cartContent = document.getElementById("cartContent");

        if (cart.length === 0) {
            cartContent.innerHTML = `
                <div class="cart-items empty-cart">
                    <h3>Your cart is empty</h3>
                    <p>You have not added any products to your cart yet.</p>
                    <a href="/products.html" class="shop-btn">
                        Continue Shopping
                    </a>
                </div>
            `;
            return;
        }

        let subtotal = 0;
        let totalQuantity = 0;

        cart.forEach(item => {
            subtotal += getLineTotal(item);
            totalQuantity += getQuantity(item);
        });

        let itemsHTML = "";

        cart.forEach((item, index) => {
            const price = getPrice(item);
            const quantity = getQuantity(item);
            const stock = getStock(item);
            const optionName = getOptionName(item);
            const lineTotal = price * quantity;

            const cannotIncrease =
                stock !== null && quantity >= stock;

            itemsHTML += `
                <div class="cart-item">

                    <div class="item-details">
                        <h3>${escapeHTML(getItemName(item))}</h3>

                        ${
                            optionName
                            ? `<p class="option-name">Option: ${escapeHTML(optionName)}</p>`
                            : ""
                        }

                        <p class="item-price">
                            ${formatPrice(price)} each
                        </p>

                        <div class="quantity-control">
                            <button
                                type="button"
                                onclick="changeQuantity(${index}, -1)"
                                aria-label="Decrease quantity"
                            >−</button>

                            <span>${quantity}</span>

                            <button
                                type="button"
                                onclick="changeQuantity(${index}, 1)"
                                aria-label="Increase quantity"
                                ${cannotIncrease ? "disabled" : ""}
                            >+</button>
                        </div>

                        ${
                            cannotIncrease
                            ? `<p class="notice">Maximum available stock reached.</p>`
                            : ""
                        }
                    </div>

                    <div class="item-right">
                        <p class="item-total">
                            ${formatPrice(lineTotal)}
                        </p>

                        <button
                            type="button"
                            class="remove-btn"
                            onclick="removeItem(${index})"
                        >
                            Remove
                        </button>
                    </div>

                </div>
            `;
        });

        cartContent.innerHTML = `
            <div class="cart-layout">

                <div class="cart-items">
                    <h3>Cart Items (${totalQuantity})</h3>
                    ${itemsHTML}
                </div>

                <div class="summary">
                    <h3>Order Summary</h3>

                    <div class="summary-row">
                        <span>Total Items</span>
                        <span>${totalQuantity}</span>
                    </div>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>${formatPrice(subtotal)}</span>
                    </div>

                    <div class="summary-row summary-total">
                        <span>Total</span>
                        <span>${formatPrice(subtotal)}</span>
                    </div>

                    <button
                        type="button"
                        class="checkout-btn"
                        onclick="proceedToCheckout()"
                    >
                        Proceed to Checkout
                    </button>

                    <a href="/products.html" class="continue-shopping">
                        Continue Shopping
                    </a>
                </div>

            </div>
        `;
    }

    function changeQuantity(index, change) {
        const item = cart[index];

        if (!item) return;

        const currentQuantity = getQuantity(item);
        const newQuantity = currentQuantity + change;
        const stock = getStock(item);

        if (newQuantity < 1) {
            return;
        }

        if (stock !== null && newQuantity > stock) {
            alert("You cannot order more than the available stock.");
            return;
        }

        item.quantity = newQuantity;
        saveCart();
    }

    function removeItem(index) {
        if (!cart[index]) return;

        cart.splice(index, 1);
        saveCart();
    }

    function proceedToCheckout() {
        if (cart.length === 0) {
            alert("Your cart is empty.");
            return;
        }

        // Preserve the existing payment page and Paystack flow.
        window.location.href = "/payment.html";
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };

            return entities[character];
        });
    }

    loadCart();
</script>

</body>
</html>
